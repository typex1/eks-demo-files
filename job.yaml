# A Job runs pods until a task completes successfully, then stops.
# Use it for batch / run-to-completion work (migrations, one-off scripts).
# `completions` = how many successful pod runs are needed.
# `backoffLimit` = how many retries before the Job is marked failed.
# `restartPolicy` must be Never or OnFailure for Jobs.
apiVersion: batch/v1
kind: Job
metadata:
  name: demo-job
  labels:
    app: demo-job
spec:
  completions: 1
  backoffLimit: 4
  template:
    metadata:
      labels:
        app: demo-job
    spec:
      restartPolicy: Never
      containers:
      - name: hello
        image: busybox:1.36
        command: ["sh", "-c", "echo 'Hello from a Kubernetes Job' && sleep 5"]
