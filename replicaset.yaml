# A ReplicaSet ensures a specified number of identical pods are running
# at any time. A Deployment normally manages ReplicaSets for you, so you
# rarely create one directly, but it shows the layer beneath a Deployment.
# Unlike a Deployment, a ReplicaSet has no rollout/rollback logic.
apiVersion: apps/v1
kind: ReplicaSet
metadata:
  name: demo-replicaset
  labels:
    app: demo-replicaset
spec:
  replicas: 3
  selector:
    matchLabels:
      app: demo-replicaset
  template:
    metadata:
      labels:
        app: demo-replicaset
    spec:
      containers:
      - name: nginx
        image: nginx:1.27
        ports:
        - containerPort: 80
